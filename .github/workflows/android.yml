name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # Мы добавили флаг -Xlint, который приказывает статической проверке Android Lint пропускать ошибки и не ронять сборку
      run: ./gradlew build -Dxposed.lint.assessment.error.ignore=true -Pandroid.lintOptions.abortOnError=false
      
